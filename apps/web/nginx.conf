# The client PWA, served from Cloud Run.
#
# nginx rather than a hand-written Node static server: serving files off a
# filesystem in response to arbitrary paths is a solved problem with a long
# list of ways to get it wrong, and path traversal and MIME sniffing are two of
# them. A forty-line server of our own would be a new place for those bugs to
# live, for no gain.

server {
  # Cloud Run's contract. It also injects PORT, which defaults to 8080 — the
  # service is deployed with that default rather than templating this file.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never a directory listing, and never nginx's version in a header.
  autoindex off;
  server_tokens off;

  # Hashed asset filenames change whenever their contents do, so they can be
  # cached hard and for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # These three must never be cached, and each for its own reason.
  #
  #   index.html      names the current asset bundle; a stale copy pins the app
  #                   to a build that may no longer exist.
  #   sw.js           is the service worker. A cached one keeps serving an old
  #                   app shell after a deploy, and can do so for a long time.
  #   manifest        is small, changes rarely, and is not worth a stale entry.
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /sw.js      { add_header Cache-Control "no-store"; }
  location ~* \.webmanifest$ { add_header Cache-Control "no-store"; }

  # The app is a single-page application: /ledger and /join are routes in the
  # browser, not files on disk, so anything that is not a real file is the
  # shell. `=404` is deliberately absent here — that is the whole point.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Matches the meta tags the app already sets, so a response is not weaker
  # than the document it carries. No Referer leaves this origin: a URL here can
  # name a route a client was on.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
