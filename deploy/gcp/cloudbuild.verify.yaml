# Builds the `verify` target of packages/api/Dockerfile.
#
# `gcloud builds submit --tag` always builds the Dockerfile's final stage, and
# the final stage is deliberately the runtime server. This config exists to
# select the other one.
#
# The verify image is not a deployable server and must never be used as one: it
# carries the full workspace, the dev dependencies and a Postgres client. It
# exists to run packages/api/scripts/verify-cloudsql.sh as a Cloud Run job
# inside the VPC, because the Cloud SQL instance is private-IP only and there is
# no path to it from outside. See docs/deploy.md §6.
#
# The tag is passed in, not baked. `$SHORT_SHA` is NOT available here: Cloud
# Build populates it only when the source comes from a connected repository,
# and `builds submit` uploads a local directory — so it would resolve to empty
# and produce an invalid image reference. This file used to reference it.
#
#   gcloud builds submit --region=us-west1 #     --config=deploy/gcp/cloudbuild.verify.yaml #     --substitutions=_TAG=$(git rev-parse --short HEAD) #     .
#
# `_TAG` has no default on purpose: omit it and the build fails loudly rather
# than quietly overwriting a `latest` that nobody can tie to a commit.

substitutions:
  _REGION: us-west1
  _REPO: courageloop
  _IMAGE: verify

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=verify
      - --file=packages/api/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
